name: Feature request
description: Propose a change to what the extension does.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The extension is deliberately small: it never blocks an edit, makes no network requests and fails silently. Proposals that keep those limits are the easiest to accept. Do not paste credentials, personal paths or private code.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you tried to do and what stopped you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The behavior you would like, and what you considered instead.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues.
          required: true
